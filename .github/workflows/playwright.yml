name: Playwright Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/playwright.yml"
      - "src/**"
      - "**/*.e2e.ts"
      - "**/*.e2e.tsx"
      - "playwright.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
jobs:
  run-playwright-e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run linter
        run: pnpm run lint:ci
      - name: Build Next.js
        run: pnpm run build
      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm list @playwright/test --depth=0 2>/dev/null | grep @playwright/test | awk '{print $NF}')" >> $GITHUB_OUTPUT
      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
      - name: Install Playwright Chromium and deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps
      - name: Run Playwright tests
        run: pnpm run test:e2e
        env:
          CI: true
